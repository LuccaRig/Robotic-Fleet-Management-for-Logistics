name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Instalar dependências no Linux
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libsqlite3-dev
      - name: Configurar os testes
        run: cmake -B build -S . -DBUILD_TESTING=ON
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Executar os testes
        run: ctest --test-dir build --output-on-failure
